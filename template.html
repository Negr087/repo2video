<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=720, height=1280">
<style>
@font-face{font-family:'Inter';font-weight:500;src:url('fonts/inter-latin-500-normal.woff2') format('woff2')}
@font-face{font-family:'Inter';font-weight:700;src:url('fonts/inter-latin-700-normal.woff2') format('woff2')}
@font-face{font-family:'Inter';font-weight:800;src:url('fonts/inter-latin-800-normal.woff2') format('woff2')}
:root{--bg:#07060d;--accent:#7c1fe0;--accent2:#a855f7;--text:#f4f2fb;--muted:#9a95b0;--card:rgba(255,255,255,.06);--line:rgba(255,255,255,.14)}
*{box-sizing:border-box}
html,body{margin:0;width:720px;height:1280px;overflow:hidden;background:var(--bg);color:var(--text);font-family:'Inter','Helvetica Neue',Arial,sans-serif;-webkit-font-smoothing:antialiased}
#bg,#stage,.scene{position:absolute;left:0;top:0;width:720px;height:1280px}
.glow{position:absolute;width:980px;height:980px;border-radius:50%;background:radial-gradient(circle,rgba(124,31,224,.42),rgba(124,31,224,0) 66%)}
.glow.b{background:radial-gradient(circle,rgba(56,189,248,.18),rgba(56,189,248,0) 66%)}
#chip{position:absolute;left:40px;top:62px;display:flex;align-items:center;gap:10px;font-weight:700;font-size:22px;color:var(--muted);letter-spacing:.02em}
#chip i{width:12px;height:12px;border-radius:50%;background:var(--accent2);box-shadow:0 0 14px var(--accent2)}
#prog{position:absolute;left:40px;right:40px;top:30px;height:5px;border-radius:5px;background:rgba(255,255,255,.1);overflow:hidden}
#prog b{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:5px}
.scene{visibility:hidden}
.eyebrow{font-weight:800;font-size:22px;letter-spacing:.22em;color:var(--accent2);text-transform:uppercase}
.head{position:absolute;left:40px;right:40px;top:130px}
.h2{margin:14px 0 0;font-weight:800;font-size:56px;line-height:1.08;letter-spacing:-.02em}
.center{position:absolute;left:50px;right:50px;top:150px;height:700px;display:flex;flex-direction:column;justify-content:center}
.h1{margin:22px 0 0;font-weight:800;line-height:1.02;letter-spacing:-.03em}
.h1 span{display:inline-block;margin-right:.22em}
.sub{margin-top:30px;font-size:36px;line-height:1.3;color:var(--muted);font-weight:500}
.bar{margin-top:34px;height:8px;border-radius:8px;background:linear-gradient(90deg,var(--accent),var(--accent2));width:0}
.caption{position:absolute;left:44px;right:44px;bottom:235px;text-align:center;font-weight:700;line-height:1.5;opacity:0}
.w{padding:3px 7px;margin:0 -1px;border-radius:12px;color:#fff;-webkit-box-decoration-break:clone;box-decoration-break:clone;text-shadow:0 2px 10px rgba(0,0,0,.6)}
.w.on{background:var(--accent)}
/* diagrama */
.node{position:absolute;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:700;line-height:1.1;padding:0 10px;border-radius:24px;background:linear-gradient(160deg,rgba(124,31,224,.38),rgba(255,255,255,.05));border:2px solid rgba(168,85,247,.7);box-shadow:0 10px 40px rgba(124,31,224,.28)}
svg.edges{position:absolute;left:0;top:0;width:720px;height:1280px;overflow:visible}
/* flujo */
.row{position:absolute;left:0;width:720px;display:flex;align-items:center}
.dot{position:absolute;left:54px;width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:28px;border:3px solid var(--line);background:#12101c;color:var(--muted)}
.txt{position:absolute;left:150px;right:44px;font-weight:700;font-size:31px;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.track,.fill{position:absolute;left:84px;width:4px;border-radius:4px}
.track{background:var(--line)}
.fill{background:linear-gradient(var(--accent),var(--accent2));box-shadow:0 0 16px var(--accent2)}
/* stack */
.pills{position:absolute;left:40px;right:40px;top:290px;height:540px;display:flex;flex-wrap:wrap;gap:20px 18px;align-content:center;justify-content:center}
.pill{display:flex;align-items:center;gap:14px;padding:18px 30px;border-radius:999px;font-weight:700;font-size:32px;background:var(--card);border:2px solid var(--line)}
.pill i{width:16px;height:16px;border-radius:50%}
</style>
</head>
<body>
<div id="bg"><div class="glow" id="g1"></div><div class="glow b" id="g2"></div></div>
<div id="stage"></div>
<div id="prog"><b></b></div>
<div id="chip"><i></i><span id="chiptxt"></span></div>
<script>
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const eo=x=>1-Math.pow(1-clamp(x),3);
const eio=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const eob=x=>{x=clamp(x);const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const prog=(t,s,d)=>clamp((t-s)/d);
const el=(tag,cls,html)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e};
const esc=s=>String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const NS='http://www.w3.org/2000/svg';
const COLORS=['#a855f7','#38bdf8','#f59e0b','#22c55e','#f43f5e','#eab308'];
let SCENES=[],TOTAL=0;

function addCaption(root,text){
  const c=el('div','caption');
  const words=String(text||'').split(/\s+/).filter(Boolean);
  const ws=words.map(w=>{const sp=el('span','w',esc(w));c.appendChild(sp);c.appendChild(document.createTextNode(' '));return sp});
  c.style.fontSize=(words.length>26?28:words.length>18?31:35)+'px';
  root.appendChild(c);
  return {c,ws};
}
function updateCaption(cap,lt,dur){
  const a=.55,b=Math.max(a+.5,dur-.45),n=cap.ws.length;
  const p=clamp((lt-a)/(b-a));
  const idx=Math.min(n-1,Math.floor(p*n));
  cap.ws.forEach((w,i)=>w.classList.toggle('on',lt>=a&&lt<b+.3&&i===idx));
  cap.c.style.opacity=eo(prog(lt,.25,.4));
}
function addHead(root,label,title){
  const h=el('div','head');
  const e=el('div','eyebrow',esc(label)); const t=el('h2','h2',esc(title));
  if(String(title).length>20)t.style.fontSize='46px';
  h.appendChild(e);h.appendChild(t);root.appendChild(h);
  return lt=>{const p=eo(prog(lt,.1,.5));h.style.opacity=p;h.style.transform=`translateY(${(1-p)*30}px)`};
}
const readTime=t=>1.0+String(t||'').split(/\s+/).filter(Boolean).length/3.0;

/* ---------- escenas ---------- */
function buildTitulo(s){
  const root=el('div','scene'),wrap=el('div','center');
  const eb=el('div','eyebrow','Cómo funciona');
  const title=String(s.titulo||'');
  const h1=el('h1','h1');h1.style.fontSize=(title.length>22?64:title.length>12?84:104)+'px';
  const ws=title.split(/\s+/).filter(Boolean).map(w=>{const sp=el('span','',esc(w));h1.appendChild(sp);return sp});
  const sub=el('div','sub',esc(s.subtitulo||'')),bar=el('div','bar');
  [eb,h1,sub,bar].forEach(x=>wrap.appendChild(x));root.appendChild(wrap);
  const cap=addCaption(root,s.narracion);
  const dur=Math.max(4.8,Math.min(11,readTime(s.narracion)+.6));
  return {root,dur,update(lt){
    eb.style.opacity=eo(prog(lt,.15,.5));
    ws.forEach((w,i)=>{const p=eo(prog(lt,.3+i*.1,.55));w.style.opacity=p;w.style.transform=`translateY(${(1-p)*46}px)`});
    const t0=.3+ws.length*.1;
    sub.style.opacity=eo(prog(lt,t0+.1,.5));sub.style.transform=`translateY(${(1-eo(prog(lt,t0+.1,.5)))*20}px)`;
    bar.style.width=(150*eo(prog(lt,t0,.8)))+'px';
    updateCaption(cap,lt,dur);
  }};
}

function layoutGraph(names,rawEdges){
  const idx=new Map(names.map((n,i)=>[n.toLowerCase(),i]));
  const seen=new Set(),edges=[];
  rawEdges.forEach(c=>{if(!c||c.length<2)return;const a=idx.get(String(c[0]).toLowerCase()),b=idx.get(String(c[1]).toLowerCase());
    if(a==null||b==null||a===b)return;const k=a+'>'+b;if(seen.has(k))return;seen.add(k);edges.push([a,b])});
  const adj=names.map(()=>[]);edges.forEach(([a,b])=>adj[a].push(b));
  const indeg=names.map(()=>0);edges.forEach(([a,b])=>indeg[b]++);
  const state=names.map(()=>0),keep=[],post=[];
  const dfs=u=>{state[u]=1;for(const v of adj[u]){if(state[v]===1)continue;keep.push([u,v]);if(state[v]===0)dfs(v)}state[u]=2;post.push(u)};
  names.forEach((_,i)=>{if(indeg[i]===0&&state[i]===0)dfs(i)});
  names.forEach((_,i)=>{if(state[i]===0)dfs(i)});
  const topo=post.slice().reverse(),layer=names.map(()=>0);
  const out=names.map(()=>[]);keep.forEach(([a,b])=>out[a].push(b));
  topo.forEach(u=>out[u].forEach(v=>{layer[v]=Math.max(layer[v],layer[u]+1)}));
  return {edges:keep,layer};
}

function buildDiagrama(s){
  const root=el('div','scene');
  const head=addHead(root,'Arquitectura',s.titulo||'Cómo está armado');
  const names=(s.nodos||[]).map(String).slice(0,8);
  const {edges,layer}=layoutGraph(names,s.conexiones||[]);
  const L=Math.max(0,...layer)+1,area={x:40,y:300,w:640,h:520};
  const nh=L>4?84:L>2?104:112;
  const gap=L>1?Math.min(200,(area.h-nh)/(L-1)):0;
  const y0=area.y+(area.h-nh-gap*(L-1))/2;
  const byLayer=Array.from({length:L},()=>[]);names.forEach((n,i)=>byLayer[layer[i]].push(i));
  const pos=[];
  byLayer.forEach((arr,li)=>{
    const n=arr.length,nw=Math.min(210,(area.w-(n-1)*24)/n),total=n*nw+(n-1)*24,x0=area.x+(area.w-total)/2;
    arr.forEach((i,k)=>{pos[i]={x:x0+k*(nw+24),y:y0+li*gap,w:nw,h:nh}});
  });
  const svg=document.createElementNS(NS,'svg');svg.setAttribute('class','edges');root.appendChild(svg);
  const order=[];byLayer.forEach(a=>a.forEach(i=>order.push(i)));
  const appear=[];order.forEach((i,k)=>appear[i]=.5+k*.32);
  const nodeEls=names.map((n,i)=>{const d=el('div','node',esc(n));const p=pos[i];
    d.style.cssText+=`left:${p.x}px;top:${p.y}px;width:${p.w}px;height:${p.h}px;font-size:${p.w<170?22:p.w<200?25:27}px`;root.appendChild(d);return d});
  const edgeEls=edges.map(([a,b],k)=>{
    const A=pos[a],B=pos[b],x1=A.x+A.w/2,y1=A.y+A.h,x2=B.x+B.w/2,y2=B.y,kk=Math.max(30,(y2-y1)*.5);
    const path=document.createElementNS(NS,'path');
    path.setAttribute('d',`M${x1} ${y1} C${x1} ${y1+kk},${x2} ${y2-kk-8},${x2} ${y2-12}`);
    path.setAttribute('fill','none');path.setAttribute('stroke','#a855f7');path.setAttribute('stroke-width','4');path.setAttribute('stroke-linecap','round');
    svg.appendChild(path);const len=path.getTotalLength();path.style.strokeDasharray=len;path.style.strokeDashoffset=len;
    const arrow=document.createElementNS(NS,'polygon');arrow.setAttribute('points',`${x2-11},${y2-22} ${x2+11},${y2-22} ${x2},${y2-2}`);arrow.setAttribute('fill','#a855f7');arrow.style.opacity=0;svg.appendChild(arrow);
    const dot=document.createElementNS(NS,'circle');dot.setAttribute('r','7');dot.setAttribute('fill','#fff');dot.style.opacity=0;svg.appendChild(dot);
    const start=Math.max(appear[a],appear[b])+.35;
    return {path,arrow,dot,len,start,k};
  });
  const cap=addCaption(root,s.narracion);
  const dur=Math.max(6,Math.min(12,Math.max(readTime(s.narracion),(edgeEls.length?Math.max(...edgeEls.map(e=>e.start)):1)+2.2)));
  return {root,dur,update(lt){
    head(lt);
    nodeEls.forEach((d,i)=>{const p=eob(prog(lt,appear[i],.5));d.style.opacity=clamp(p*1.4);d.style.transform=`scale(${.7+.3*p})`});
    edgeEls.forEach(e=>{
      const p=eio(prog(lt,e.start,.7));e.path.style.strokeDashoffset=e.len*(1-p);
      e.arrow.style.opacity=p>=1?1:0;
      if(p>=1){const q=(((lt-e.start-.7)*.4+e.k*.23)%1+1)%1,pt=e.path.getPointAtLength(e.len*q);e.dot.setAttribute('cx',pt.x);e.dot.setAttribute('cy',pt.y);e.dot.style.opacity=.9}else e.dot.style.opacity=0;
    });
    updateCaption(cap,lt,dur);
  }};
}

function buildFlujo(s){
  const root=el('div','scene');
  const head=addHead(root,'Flujo',s.titulo||'Qué pasa');
  const steps=(s.pasos||[]).map(String).slice(0,6),n=Math.max(1,steps.length);
  const area={y:300,h:540},rowH=Math.min(112,area.h/n),y0=area.y+(area.h-rowH*n)/2;
  const track=el('div','track'),fill=el('div','fill');
  track.style.cssText+=`top:${y0+rowH/2}px;height:${rowH*(n-1)}px`;fill.style.cssText+=`top:${y0+rowH/2}px;height:0px`;
  root.appendChild(track);root.appendChild(fill);
  const dots=[],txts=[];
  steps.forEach((t,i)=>{
    const d=el('div','dot',String(i+1));d.style.top=(y0+i*rowH+rowH/2-32)+'px';
    const x=el('div','txt',esc(t));x.style.top=(y0+i*rowH+rowH/2-37)+'px';x.style.height='74px';x.style.justifyContent='flex-start';
    x.style.display='flex';x.style.alignItems='center';x.style.webkitLineClamp='unset';
    root.appendChild(d);root.appendChild(x);dots.push(d);txts.push(x);
  });
  const cap=addCaption(root,s.narracion);
  const stepDur=Math.max(1.1,Math.min(1.8,2.2+0*n));
  const dur=Math.max(6,Math.min(13,Math.max(readTime(s.narracion),.8+n*stepDur+1.2)));
  const sd=(dur-1.4)/n;
  return {root,dur,update(lt){
    head(lt);
    const a=i=>.7+i*sd;
    let k=0;for(let i=0;i<n;i++)if(lt>=a(i))k=i;
    const started=lt>=a(0);
    fill.style.height=(k===0?0:((k-1)+eo(prog(lt,a(k),.45)))*rowH)+'px';
    dots.forEach((d,i)=>{
      const st=!started||i>k?'future':i===k?'active':'past';
      const pop=i===k?eob(prog(lt,a(i),.4)):1;
      if(st==='active'){d.style.background='#7c1fe0';d.style.borderColor='#a855f7';d.style.color='#fff';d.style.boxShadow='0 0 30px rgba(168,85,247,.8)';d.textContent=String(i+1);d.style.transform=`scale(${1+.12*pop})`}
      else if(st==='past'){d.style.background='rgba(124,31,224,.28)';d.style.borderColor='#a855f7';d.style.color='#d8b4fe';d.style.boxShadow='none';d.textContent='✓';d.style.transform='scale(1)'}
      else{d.style.background='#12101c';d.style.borderColor='rgba(255,255,255,.14)';d.style.color='#9a95b0';d.style.boxShadow='none';d.textContent=String(i+1);d.style.transform='scale(1)'}
      const appear=eo(prog(lt,.3+i*.08,.4));
      txts[i].style.opacity=(st==='active'?1:st==='past'?.6:.28)*appear;
      txts[i].style.transform=`translateX(${st==='active'?(1-eo(prog(lt,a(i),.4)))*40:0}px)`;
    });
    updateCaption(cap,lt,dur);
  }};
}

function buildStack(s){
  const root=el('div','scene');
  const head=addHead(root,'Stack',s.titulo||'Tecnologías');
  const items=(s.items||[]).map(String).slice(0,10);
  const box=el('div','pills');root.appendChild(box);
  const pills=items.map((t,i)=>{const p=el('div','pill','<i></i>'+esc(t));p.querySelector('i').style.background=COLORS[i%COLORS.length];p.querySelector('i').style.boxShadow='0 0 12px '+COLORS[i%COLORS.length];box.appendChild(p);return p});
  const cap=addCaption(root,s.narracion);
  const dur=Math.max(5.5,Math.min(11,Math.max(readTime(s.narracion),1+items.length*.3+1.5)));
  return {root,dur,update(lt){
    head(lt);
    pills.forEach((p,i)=>{const q=eob(prog(lt,.4+i*.2,.5));p.style.opacity=clamp(q*1.5);
      p.style.transform=`translateY(${(1-clamp(q))*30+Math.sin(lt*1.6+i)*3}px) scale(${.8+.2*q})`});
    updateCaption(cap,lt,dur);
  }};
}

function buildCierre(s){
  const root=el('div','scene'),wrap=el('div','center');wrap.style.alignItems='center';wrap.style.textAlign='center';
  const ring=document.createElementNS(NS,'svg');ring.setAttribute('width','240');ring.setAttribute('height','240');ring.setAttribute('viewBox','0 0 240 240');
  ring.innerHTML='<circle cx="120" cy="120" r="96" fill="none" stroke="#a855f7" stroke-width="6" stroke-linecap="round" stroke-dasharray="603" stroke-dashoffset="603" transform="rotate(-90 120 120)"/><path d="M78 124 L108 152 L164 92" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="140" stroke-dashoffset="140"/>';
  const circle=ring.children[0],tick=ring.children[1];
  const h1=el('h1','h1',esc(s.titulo||''));h1.style.fontSize=((s.titulo||'').length>24?58:72)+'px';h1.style.marginTop='40px';
  const sub=el('div','sub',esc(s.texto||''));
  [ring,h1,sub].forEach(x=>wrap.appendChild(x));root.appendChild(wrap);
  const dur=Math.max(4.5,Math.min(8,readTime(s.texto)+2.2));
  return {root,dur,update(lt){
    circle.style.strokeDashoffset=603*(1-eio(prog(lt,.2,.8)));tick.style.strokeDashoffset=140*(1-eio(prog(lt,.9,.5)));
    const p=eo(prog(lt,.6,.6));h1.style.opacity=p;h1.style.transform=`translateY(${(1-p)*30}px)`;
    const q=eo(prog(lt,1,.6));sub.style.opacity=q;sub.style.transform=`translateY(${(1-q)*20}px)`;
    ring.style.transform=`scale(${1+.03*Math.sin(lt*3)})`;
  }};
}
const BUILD={titulo:buildTitulo,diagrama:buildDiagrama,flujo:buildFlujo,stack:buildStack,cierre:buildCierre};

window.init=function(sb){
  document.getElementById('chiptxt').textContent=sb.titulo||'';
  const stage=document.getElementById('stage');stage.innerHTML='';SCENES=[];
  let t=0;const OVERLAP=0;
  (sb.escenas||[]).forEach(s=>{const b=BUILD[s.tipo];if(!b)return;const sc=b(s);sc.start=t;t+=sc.dur-OVERLAP;stage.appendChild(sc.root);SCENES.push(sc)});
  TOTAL=t;window.TOTAL=TOTAL;
};
window.seek=function(t){
  document.getElementById('g1').style.transform=`translate(${-300+Math.sin(t*.35)*70}px,${-260+Math.cos(t*.3)*60}px)`;
  document.getElementById('g2').style.transform=`translate(${160+Math.cos(t*.28)*60}px,${620+Math.sin(t*.33)*70}px)`;
  document.querySelector('#prog b').style.width=(100*clamp(t/TOTAL))+'%';
  SCENES.forEach(sc=>{
    const lt=t-sc.start,vis=lt>=0&&lt<=sc.dur;
    sc.root.style.visibility=vis?'visible':'hidden';
    if(!vis)return;
    sc.root.style.opacity=Math.min(eo(lt/.3),eo((sc.dur-lt)/.3));
    sc.update(lt);
  });
};
</script>
</body>
</html>
